name: Publicar imagenes

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir y publicar cada Dockerfile que exista
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -name Dockerfile -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::Todavia no hay Dockerfile"
            exit 0
          fi
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for f in "${files[@]}"; do
            dir=$(dirname "$f")
            name=$(basename "$dir")
            [ "$name" = "." ] && name=app
            image=$(echo "ghcr.io/$GITHUB_REPOSITORY/$name:$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]')
            docker build -t "$image" "$dir"
            docker push "$image"
          done
