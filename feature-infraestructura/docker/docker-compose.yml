name: envdoctor

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: envdoctor
      POSTGRES_USER: envdoctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envdoctor -d envdoctor"]
      interval: 10s
      retries: 5

  web:
    build: ../../feature-frontend
    ports:
      - "127.0.0.1:8080:80"

  # api: se agrega cuando exista el proyecto de B y su Dockerfile.

volumes:
  db-data:
